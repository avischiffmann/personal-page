<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avi Schiffmann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #f4efe6;
    color: #1c1a17;
    font-family: 'Fraunces', Georgia, serif;
  }

  p {
    text-align: center;
    max-width: 22em;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    line-height: 1.5;
    font-weight: 400;
  }

  a {
    color: #a8431f;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    transition: opacity 0.25s ease;
  }

  a:hover { opacity: 0.6; }
</style>
</head>
<body>
  <p>Avi Schiffmann is the founder of <a href="https://friend.com">friend.com</a> and lives in San Francisco, California.</p>
</body>
</html>
